<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TouchMap</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
      body { background: #f5f3ee; font-family: system-ui, sans-serif; }
      #map { cursor: crosshair; display: block; width: 100%; height: 100%; touch-action: none; }
      #map-pointer { position: fixed; top: 0; left: 0; width: 28px; height: 28px; margin: -14px; box-sizing: border-box; border: 2px solid #c6f5ff; border-radius: 50%; background: #42c9ff33; box-shadow: 0 0 0 5px #42c9ff18, 0 2px 8px #0006; pointer-events: none; z-index: 1; }
      #map-pointer::after { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: #e5fbff; box-shadow: 0 0 7px #42c9ff; }
      #map.dragging + #map-pointer { background: #42c9ff77; border-color: white; }
      #controls { position: fixed; right: 16px; top: 64px; display: grid; gap: 6px; color: white; text-align: center; }
      #controls button { min-width: 44px; min-height: 44px; border: 1px solid #648090; border-radius: 8px; background: #142b38; color: white; font-size: 20px; cursor: pointer; }
      #controls #reset-map { font-size: 12px; padding: 8px; }
      #route-legend { position: fixed; top: 57px; left: 16px; padding: 8px 10px; border-radius: 8px; background: #102633ee; color: #edf3f6; font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 120px); }
      #route-legend[hidden] { display: none; }
      #route-legend button { min-height: 40px; padding: 8px 12px; border: 1px solid #648090; border-radius: 6px; background: #142b38; color: #edf3f6; cursor: pointer; }
      #route-legend button[aria-pressed="true"] { border-color: currentColor; background: #304d60; box-shadow: inset 0 -3px currentColor; }
      #route-legend button[data-route="Bocconi Sport Center"] { color: #57e0ff; }
      #route-legend button[data-route="Sarfatti Building"] { color: #ff8acb; }
      #haptics { position: fixed; left: 16px; bottom: 60px; max-width: min(310px, calc(100vw - 32px)); padding: 12px; border-radius: 10px; background: #102633ee; color: #edf3f6; font-size: 12px; }
      #haptics button { min-height: 40px; margin-right: 6px; cursor: pointer; }
      #haptic-status { margin: 8px 0 0; }
      #navigation { pointer-events: none; position: fixed; left: 16px; bottom: 175px; width: min(260px, calc(100vw - 48px)); padding: 8px; border-radius: 8px; background: #102633f5; color: #edf3f6; font-size: 12px; }
      #navigation h2 { margin: 0; font-size: 12px; }
      #navigation-message { margin: 6px 0; line-height: 1.3; }
      #navigation button { pointer-events: auto; min-height: 32px; font-size: 12px; border: 1px solid #648090; border-radius: 6px; background: #142b38; color: white; padding: 5px 7px; cursor: pointer; }
      #navigation-voice-choice { pointer-events: auto; width: 100%; min-height: 28px; margin-top: 5px; font-size: 12px; background: #142b38; color: white; border: 1px solid #648090; border-radius: 6px; }
      #speech-status { display: block; margin-top: 4px; font-size: 10px; color: #b8cbd6; }
      @media (pointer: coarse) { #navigation button, #navigation-voice-choice { min-height: 44px; } }
      #start { z-index: 2; position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #142b38; color: white; font: 600 clamp(3rem, 12vw, 7rem) system-ui, sans-serif; cursor: pointer; }
      #start[hidden] { display: none; }
      #status { position: fixed; left: 1rem; bottom: 2.5rem; margin: 0; font-size: 0.9rem; }
      #pointer-help { position: fixed; right: 12px; bottom: 27px; margin: 0; color: #b8cbd6; font-size: 10px; pointer-events: none; }
      @media (pointer: coarse) { #pointer-help { display: none; } }
      #attribution { position: fixed; right: 0.75rem; bottom: 0.5rem; color: #b8cbd6; font-size: 0.7rem; }
    </style>
  </head>
  <body>
    <canvas id="map" role="application" aria-label="TouchMap" tabindex="0"></canvas>
    <div id="map-pointer" aria-hidden="true" hidden></div>
    <a id="attribution" href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>
    <nav id="controls" aria-label="Map controls">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <output id="zoom-level" aria-label="Zoom level">1.0×</output>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <button id="reset-map" aria-label="Reset map">Reset</button>
      <button id="go-home" aria-label="Home" title="Home" hidden>⌂</button>
    </nav>
    <aside id="route-legend" aria-label="Demo routes" hidden>
      <button type="button" data-route="" aria-pressed="true">Default</button>
      <button type="button" data-route="Bocconi Sport Center" aria-pressed="false">Bocconi Sport Center</button>
      <button type="button" data-route="Sarfatti Building" aria-pressed="false">Sarfatti Building</button>
    </aside>
    <section id="haptics" aria-label="Map haptic exploration" hidden>
      <button id="haptic-start" disabled>Enable haptics</button>
      <button id="haptic-stop" disabled>Pause haptics</button>
      <p id="haptic-status" role="status">Connecting to local haptics…</p>
    </section>
    <section id="navigation" aria-label="Route practice" hidden>
      <h2 id="navigation-title">Route practice</h2>
      <p id="navigation-message" aria-live="off"></p>
      <button id="navigation-repeat" type="button">Repeat instruction</button>
      <button id="navigation-voice" type="button" aria-pressed="false">Mute voice</button>
      <select id="navigation-voice-choice" aria-label="Navigation voice"></select>
      <small id="speech-status" role="status">Voice on · route practice</small>
    </section>
    <button id="start" type="button">Start</button>
    <p id="pointer-help">Click map to capture mouse · Esc releases · ⌘ returns Home</p>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
